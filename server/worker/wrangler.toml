name = "openparty"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "PARTY"
class_name = "Party"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Party"]

# No request logs: the server keeps nothing about parties or people (see PRIVACY.md).
[observability]
enabled = false
